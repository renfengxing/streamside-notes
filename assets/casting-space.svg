<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Pause before each cast</title><desc id="desc">A checklist of directions to inspect, not a measured clearance diagram.</desc><rect width="720" height="350" rx="16" fill="#e4ede5"/><g fill="#203c36" font-family="sans-serif"><text x="30" y="45" font-size="25">Pause before each cast</text><rect x="30" y="65" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="98" font-size="21">1. LOOK BEHIND</text><rect x="30" y="130" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="163" font-size="21">2. LOOK ABOVE</text><rect x="30" y="195" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="228" font-size="21">3. CHECK BOTH SIDES</text><rect x="30" y="260" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="293" font-size="21">4. PEOPLE ENTER? PAUSE</text></g></svg>
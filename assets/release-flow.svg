<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 350" role="img" aria-labelledby="title desc"><title id="title">Prepare for a careful release</title><desc id="desc">A reading order for release preparation and minimal handling.</desc><rect width="720" height="350" rx="16" fill="#e4ede5"/><g fill="#203c36" font-family="sans-serif"><text x="30" y="45" font-size="25">Prepare for a careful release</text><rect x="30" y="65" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="98" font-size="21">1. TOOLS READY</text><rect x="30" y="130" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="163" font-size="21">2. KEEP IN WATER</text><rect x="30" y="195" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="228" font-size="21">3. ACCESSIBLE HOOK: USE TOOL</text><rect x="30" y="260" width="660" height="50" rx="8" fill="#fffdf6"/><text x="50" y="293" font-size="21">4. RETURN CAREFULLY</text></g></svg>